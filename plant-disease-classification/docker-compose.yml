services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/train/checkpoints:/app/train/checkpoints
    environment:
      - MODEL_ARCH=resnet50

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
